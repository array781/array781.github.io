<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message from Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .admin-message {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      background: white;
      border-radius: 15px;
      border-top: 5px solid #2563eb;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .admin-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      color: #2563eb;
      font-size: 27px;
      margin: 10px 0;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    .message {
      margin: 25px 0;
      padding: 18px;
      background: #eff6ff;
      border-radius: 10px;
      color: #334155;
      font-size: 16px;
      line-height: 1.7;
      text-align: left;
    }

    .posted-by {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .home-button {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .home-button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <main class="admin-message">
    <div class="admin-icon">📢</div>

    <h1>Message from Admin</h1>
    <div class="subtitle">Official Announcement</div>

    <div class="message">
      Welcome to our website! Please stay updated
      for important announcements and information.
      Thank you for visiting our page!
    </div>

    <div class="posted-by">
      Posted by the Administrator
    </div>

    <a href="index.html" class="home-button">
      ← Back to Home
    </a>
  </main>

</body>
</html>
